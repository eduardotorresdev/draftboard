# Quatro caminhos colidem no mesmo segmento `corpo`: dois Retângulos com `id:
# corpo`, um Slot chamado `corpo` e mais um Retângulo. Três colisões seguidas
# são o que separa desambiguar de só empurrar a colisão para o vizinho.
# O Slot `pe` ainda declara um id, que perde para o nome do Slot.
elements:
  - rect: {x: 0, y: 0, w: 10, h: 10}
    id: corpo
  - slot: "corpo"
    box: {x: 20, y: 20, w: 50, h: 50}
  - rect: {x: 0, y: 20, w: 10, h: 10}
    id: corpo
  - rect: {x: 0, y: 40, w: 10, h: 10}
    id: corpo
  - slot: "pe"
    id: outro
    box: {x: 0, y: 80, w: 100, h: 10}
