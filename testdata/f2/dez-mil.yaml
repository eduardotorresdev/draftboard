# Exatamente LimiteDeElementos Elementos no Frame: 10 Instâncias de um
# Componente que repete 1000 vezes. O teto é inclusivo.
frames:
  - name: tela
    w: 100
    h: 100
    layers:
      - name: base
        elements:
          - use: "./mil.yaml"
            box: {x: 0, y: 0, w: 10, h: 100}
            id: bloco
            repeat: {n: 10, axis: x, gap: 0}
