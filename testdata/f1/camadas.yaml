frames:
  - name: tela
    w: 100
    h: 100
    layers:
      - name: conteudo
        elements:
          - rect: {x: 0, y: 0, w: 100, h: 100}
            id: fundo
      # Camada declarada e ainda sem Elementos: continua somando seu degrau.
      - name: separador
      - name: modal
        elements:
          - rect: {x: 20, y: 20, w: 60, h: 60}
            id: caixa
          - rect: {x: 30, y: 30, w: 20, h: 20}
            id: botao
