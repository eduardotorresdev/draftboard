# Gate deste projeto: não há CI de teste (só release.yml, disparado por tag).
EX_GATE=local
EX_LOCAL_GATE="go build ./... && go vet ./... && test -z \"$(gofmt -l . | grep -v '^\\.claude/')\" && go test ./..."
EX_FMT="gofmt -l . | grep -v '^\\.claude/'"
EX_TRACKER="docs/ (sem tracker externo; issue vira nota no repo)"
